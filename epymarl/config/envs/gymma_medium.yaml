env: "gymma"
seed: 12345 

env_args:
  key: null
  time_limit: 50
  pretrained_wrapper: null
  seed: 12345
  observation_mode: "MEDIUM"

test_greedy: True
test_nepisode: 100
test_interval: 50000
log_interval: 50000
runner_log_interval: 1000
learner_log_interval: 50000
# buffer_size: 20000
# batch_size: 1024
# lr: 0.001
t_max: 20000000
use_cuda: True
epochs: 4
target_update_interval_or_tau: 500

