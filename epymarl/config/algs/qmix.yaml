# --- QMIX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 400000
evaluation_epsilon: 0.1

runner: "episode"

buffer_size: 50000
batch_size: 1024

lr: 0.001
lr_scheduler: True
lr_decay_steps: 50000
lr_decay_rate: 0.95

# update the target network every {} episodes
target_update_interval_or_tau: 25

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

# use the Q_Learner to train
standardise_returns: False
standardise_rewards: False

agent_output_type: "q"
learner: "q_learner"
double_q: True
mixer: "qmix"
use_rnn: True
mixing_embed_dim: 192
hypernet_layers: 2
hypernet_embed: 256
t_max: 2000000

name: "qmix"

save_model_interval: 250000 # Save models after this many timesteps