# --- RODE specific parameters ---

action_selector: "soft_epsilon_greedy"
action_encoder: "obs_reward"
epsilon_start: 1.0
epsilon_finish: 0.05
role_epsilon_finish: 0.05
epsilon_anneal_time: 70000
epsilon_anneal_time_exp: 70000

runner: "episode"

buffer_size: 5000

target_update_interval: 500

agent_output_type: "q"
learner: "rode_learner"
double_q: True
mixer: "qmix"
role_mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

name: "rode"
mac: "rode_mac"
agent: "rode"
role: "dot"
role_selector: "dot"
bi_opt: False

n_role_clusters: 3
role_interval: 5
state_latent_dim: 32
action_latent_dim: 20
role_action_spaces_update_start: 200000

optim_alpha: 0.99
optim_eps: 0.00001
grad_norm_clip: 10
lr: 0.0001

verbose: False
rnn_hidden_dim: 64
